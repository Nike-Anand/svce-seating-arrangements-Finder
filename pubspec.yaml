name: svce_seating_finder
description: A Flutter app to find SVCE seating arrangements

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  url_launcher: ^6.2.1
  html: ^0.15.4
  path_provider: ^2.1.1
  dio: ^5.3.2
  syncfusion_flutter_pdf: ^23.2.7
  flutter_local_notifications: ^17.0.0
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2
  shared_preferences: ^2.2.2
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "icon.png"